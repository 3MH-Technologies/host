# fly.toml app configuration file generated for host-3mh on 2026-08-18T00:26:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'host-3mh'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'file:/data/custom.db'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'host_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
