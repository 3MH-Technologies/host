#!/usr/sbin/nft -f
# 3MH Host Zero-Trust nftables Firewall Configuration
# Flushes existing rules and enforces strict Zero-Trust Egress and East-West Isolation

flush ruleset

table inet filter {
    # Sets for anti-SSRF internal metadata and private range blocking
    set blocked_ipv4_ssrf {
        type ipv4_addr
        flags interval
        elements = {
            127.0.0.0/8,        # Loopback
            10.0.0.0/8,         # Class A Private Network
            172.16.0.0/12,      # Class B Private Network
            192.168.0.0/16,     # Class C Private Network
            169.254.169.254/32, # Cloud Metadata Endpoint (AWS/GCP/Azure)
            169.254.0.0/16,     # Link-Local Range
            224.0.0.0/4,        # Multicast
            240.0.0.0/4         # Reserved
        }
    }

    set blocked_ipv6_ssrf {
        type ipv6_addr
        flags interval
        elements = {
            ::1/128,            # IPv6 Loopback
            fc00::/7,           # Unique Local Address (ULA)
            fe80::/10           # Link-Local Address
        }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # Allow established and related connections
        ct state established,related accept

        # Allow loopback traffic on host
        iifname "lo" accept

        # Drop invalid connections
        ct state invalid drop

        # Reject incoming connections to tenant containers from external
        # Allowed inbound HTTP/HTTPS proxying handled explicitly via reverse proxy
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Allow established and related connections for outbound tenant requests
        ct state established,related accept

        # Anti-SSRF Protection: Drop requests targeting private or metadata IPs from tenant bridges
        iifname "br-tenant-*" ip daddr @blocked_ipv4_ssrf drop
        iifname "br-tenant-*" ip6 daddr @blocked_ipv6_ssrf drop

        # East-West Traffic Isolation: Block inter-tenant communication between different docker bridges
        iifname "br-tenant-*" oifname "br-tenant-*" drop

        # Allow outbound Internet Egress (HTTP/HTTPS, DNS)
        iifname "br-tenant-*" oifname != "br-tenant-*" udp dport 53 accept
        iifname "br-tenant-*" oifname != "br-tenant-*" tcp dport { 53, 80, 443 } accept

        # Drop any other forwarded packets
        drop
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
