[PHP]
;; 3MH Host Production Hardened php.ini Configuration
;; Language Hardening Directives for Multi-Tenant Sandbox Isolation

[PHP]
;; Disable dangerous system call, execution, dynamic loading, and file inclusion functions
disable_functions = exec, system, shell_exec, passthru, proc_open, popen, curl_exec, parse_ini_file, show_source, symlink, link, dl, pssht, pcntl_exec, pcntl_fork, sys_getloadavg, putenv, ini_set

;; Restrict filesystem access exclusively to tenant jailed directory
open_basedir = "/var/www/html:/tmp"

;; Prevent execution of uploaded or arbitrary code via URLs
allow_url_fopen = Off
allow_url_include = Off

;; Information Disclosure Protections
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log

;; Execution and Resource Limits
max_execution_time = 30
max_input_time = 30
memory_limit = 128M
post_max_size = 16M
upload_max_filesize = 10M
max_file_uploads = 5

;; Session Hardening
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Strict"
session.use_only_cookies = 1
session.entropy_length = 32

;; Disable dangerous wrappers
phar.readonly = 1
